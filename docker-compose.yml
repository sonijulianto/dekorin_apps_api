services:
  postgres:
    image: postgres:15-alpine
    container_name: dekorin_postgres
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: SecretPostgresPassword123!
      POSTGRES_DB: dekorin
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"

  api:
    build: .
    container_name: dekorin_api
    restart: always
    depends_on:
      - postgres
    environment:
      PORT: 3000
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: postgres
      DB_PASSWORD: SecretPostgresPassword123!
      DB_NAME: dekorin
      DB_SSLMODE: disable
    volumes:
      - ./uploads:/app/uploads
    ports:
      - "3000:3000"

volumes:
  pgdata:
